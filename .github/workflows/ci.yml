name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Compile the executable and smoke-test it
        run: |
          dart compile exe bin/cairn_ui_mcp.dart -o build/cairn_ui_mcp
          ./build/cairn_ui_mcp --info
