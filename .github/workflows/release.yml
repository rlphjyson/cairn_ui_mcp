name: Release

# Pushing a tag like v0.1.0 builds a self-contained binary per platform and
# attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: cairn_ui_mcp-linux-x64
          - os: macos-latest
            asset: cairn_ui_mcp-macos-arm64
          - os: windows-latest
            asset: cairn_ui_mcp-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - run: dart pub get
      - run: dart test
      - run: dart compile exe bin/cairn_ui_mcp.dart -o ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
